name: Build FlashEnglish APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install web dependencies
        run: npm install

      - name: Build static web app
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Sync web app to Android
        run: npx cap sync android

      - name: Add microphone permission
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()

          perm = '    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n'

          if 'android.permission.RECORD_AUDIO' not in s:
              s = s.replace('</manifest>', perm + '</manifest>')

          p.write_text(s)
          PY

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlashEnglish-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
